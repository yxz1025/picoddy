<!doctype html>
<html><head><meta charset="utf-8"><title>可视化</title></head><body>
<script>
(() => {
  // Only the embedding parent can initialize this opaque-origin sandbox, once.
  function initialize(event) {
    if (parent === window || event.source !== parent || event.data?.type !== 'widget:init') return;
    const html = event.data.html;
    if (typeof html !== 'string' || html.length > 8000000) return;
    removeEventListener('message', initialize);
    document.open();
    document.write(html);
    document.close();
  }
  addEventListener('message', initialize);
})();
</script>
</body></html>
