<!doctype html>
<html lang="zh-CN" data-state="loading">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiCoddy</title>
    <style>
      :root {
        color: #f5f5f7;
        background: #121214;
        font-family: ui-rounded, "SF Pro Rounded", "PingFang SC", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #121214;
      }

      body {
        display: grid;
        place-items: center;
        -webkit-app-region: no-drag;
        user-select: none;
      }

      .startup-drag-region {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        left: 0;
        height: 38px;
        -webkit-app-region: drag;
      }

      html[data-platform="windows"] body {
        padding-top: 30px;
      }

      .startup-stage {
        position: relative;
        display: grid;
        min-width: 240px;
        min-height: 180px;
        place-items: center;
      }

      .startup-stage::before {
        position: absolute;
        width: 152px;
        height: 152px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 245, 247, .055), transparent 67%);
        content: "";
        filter: blur(4px);
      }

      .orb {
        position: relative;
        z-index: 1;
        animation: startup-in 420ms cubic-bezier(.22, .8, .3, 1) both;
        filter: drop-shadow(0 0 20px rgba(245, 245, 247, .075));
      }

      .startup-error {
        position: absolute;
        top: calc(50% + 70px);
        left: 50%;
        width: max-content;
        max-width: min(360px, 80vw);
        margin: 0;
        color: rgba(245, 245, 247, .62);
        font-size: 12px;
        font-weight: 430;
        letter-spacing: .04em;
        line-height: 1.7;
        opacity: 0;
        text-align: center;
        transform: translate(-50%, 6px);
        transition: opacity 180ms ease, transform 180ms ease;
        visibility: hidden;
      }

      html[data-state="error"] .orb {
        opacity: .32;
        transition: opacity 180ms ease;
      }

      html[data-state="error"] .orb-arm,
      html[data-state="error"] .orb-bead {
        animation-play-state: paused;
      }

      html[data-state="error"] .startup-error {
        opacity: 1;
        transform: translate(-50%, 0);
        visibility: visible;
      }

      @keyframes startup-in {
        from { opacity: 0; transform: scale(.94); }
        to { opacity: 1; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb { animation: none; }
        .startup-error { transition: none; }
      }
    </style>
    <script>
      if (/Windows/i.test(navigator.userAgent)) {
        document.documentElement.dataset.platform = "windows";
      }
      if (new URLSearchParams(location.search).get("state") === "error") {
        document.documentElement.dataset.state = "error";
      }
    </script>
  </head>
  <body>
    <div class="startup-drag-region" aria-hidden="true"></div>
    <main class="startup-stage" aria-live="polite">
      <img class="orb" src="../app-icon.png" width="96" height="96" alt="PiCoddy" />
      <p class="startup-error" role="alert">启动失败，请查看启动日志（Windows：%LOCALAPPDATA%\PiCoddy\logs\startup.log）</p>
    </main>
  </body>
</html>
