<style>
#rq-multi {--rq-bg:light-dark(#fff,#202020);--rq-side:light-dark(#f7f7f5,#262626);--rq-text:light-dark(#292927,#ededeb);--rq-muted:light-dark(#666662,#b0b0aa);--rq-line:light-dark(#e3e3df,#42423f);--rq-active:light-dark(#eaeae5,#393936);--rq-accent:light-dark(#2f6151,#a2ceb9);color:var(--rq-text);background:var(--rq-bg);font-family:system-ui,sans-serif;border:1px solid var(--rq-line);border-radius:12px;overflow:hidden;position:relative}
#rq-multi *{box-sizing:border-box}#rq-multi button,#rq-multi input,#rq-multi select,#rq-multi textarea{font:inherit;color:inherit}#rq-multi button{background:var(--rq-bg);border:1px solid var(--rq-line);border-radius:6px;padding:7px 10px;cursor:pointer}#rq-multi button:disabled{opacity:.5;cursor:default}#rq-multi .rq-primary{background:var(--rq-text);color:var(--rq-bg);border-color:var(--rq-text)}#rq-multi .rq-chrome{background:var(--rq-side);padding:12px 18px;border-bottom:1px solid var(--rq-line);display:flex;align-items:center;gap:16px}#rq-multi .rq-muted{color:var(--rq-muted)}#rq-multi .rq-grow{flex:1}#rq-multi .rq-header{padding:18px 22px;border-bottom:1px solid var(--rq-line)}#rq-multi h2,#rq-multi h3,#rq-multi p{margin:0}#rq-multi .rq-title{display:flex;gap:12px;align-items:center;margin:8px 0 16px}#rq-multi .rq-stagebar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}#rq-multi select,#rq-multi input:not([type=checkbox]),#rq-multi textarea{background:var(--rq-bg);border:1px solid var(--rq-line);border-radius:6px;padding:8px;min-width:0}#rq-multi .rq-body{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:500px}#rq-multi .rq-chat{display:flex;flex-direction:column;min-width:0;padding:22px;gap:18px}#rq-multi .rq-transcript{flex:1;max-height:340px;overflow:auto;display:flex;flex-direction:column;gap:18px}#rq-multi .rq-message{max-width:95%;line-height:1.6}#rq-multi .rq-message p{margin-top:7px}#rq-multi .rq-message.user{align-self:flex-end;background:var(--rq-side);padding:12px 14px;border-radius:9px}#rq-multi .rq-message details{margin-top:9px;color:var(--rq-muted)}#rq-multi .rq-message pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}#rq-multi .rq-compose{border:1px solid var(--rq-line);border-radius:10px;padding:12px}#rq-multi .rq-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}#rq-multi .rq-chip{border-radius:5px;background:var(--rq-side);padding:4px 7px;border:1px solid var(--rq-line)}#rq-multi textarea{border:0;resize:vertical;width:100%;min-height:70px;padding:4px}#rq-multi .rq-actions{display:flex;align-items:center;gap:10px;margin-top:10px}#rq-multi .rq-inspector{border-left:1px solid var(--rq-line);background:var(--rq-side);min-width:0}#rq-multi .rq-tabs{display:flex;padding:0 15px;border-bottom:1px solid var(--rq-line);gap:12px}#rq-multi .rq-tabs button{padding:15px 2px;border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent}#rq-multi .rq-tabs button[aria-selected=true]{border-bottom-color:var(--rq-text)}#rq-multi .rq-panel{padding:18px;max-height:490px;overflow:auto}#rq-multi .rq-panel[hidden]{display:none}#rq-multi .rq-row{padding:14px 0;border-bottom:1px solid var(--rq-line)}#rq-multi .rq-row:first-of-type{padding-top:8px}#rq-multi .rq-row label{display:flex;gap:8px;align-items:center;margin-bottom:8px}#rq-multi .rq-row p{color:var(--rq-muted);margin:5px 0;overflow-wrap:anywhere}#rq-multi .rq-row .rq-path{color:var(--rq-text)}#rq-multi .rq-role{color:var(--rq-accent);margin-right:7px}#rq-multi .rq-footer{padding:10px 22px;background:var(--rq-side);border-top:1px solid var(--rq-line);color:var(--rq-muted)}#rq-multi .rq-overlay{position:absolute;inset:0;background:light-dark(#0005,#0009);z-index:5;display:flex;align-items:center;justify-content:center;padding:20px}#rq-multi .rq-overlay[hidden]{display:none}#rq-multi .rq-dialog{background:var(--rq-bg);border:1px solid var(--rq-line);border-radius:12px;padding:24px;width:440px;max-width:100%;max-height:95%;overflow:auto}#rq-multi .rq-dialog label{display:grid;gap:6px;margin-top:14px}#rq-multi .rq-dialog .rq-actions{justify-content:flex-end;margin-top:22px}#rq-multi .rq-alert{color:var(--rq-accent);margin-top:10px}#rq-multi input[type=checkbox]{accent-color:var(--rq-accent)}
@media(max-width:730px){#rq-multi .rq-body{grid-template-columns:1fr}#rq-multi .rq-inspector{border-left:0;border-top:1px solid var(--rq-line)}#rq-multi .rq-chat{min-height:360px}#rq-multi .rq-panel{max-height:260px}}
</style>
<div id="rq-multi" aria-label="产研工作台多仓库交互方案">
  <div class="rq-chrome"><strong>PiCoddyClaw</strong><span class="rq-muted">需求与产研工作台</span><span class="rq-grow"></span><span class="rq-muted">交互方案 · 示例数据</span></div>
  <header class="rq-header"><span class="rq-muted">我的需求 / 供应链协作平台 / #10428</span><div class="rq-title"><h2>门店补货审批流程</h2><span class="rq-grow"></span><span class="rq-muted">TAPD：开发中</span></div><div class="rq-stagebar"><label>阶段 <select id="rq-stage"><option value="architecture">软件架构设计</option><option value="development">软件开发</option></select></label><span id="rq-expert">已绑定：软件架构师</span><span class="rq-grow"></span><button id="rq-add-top">＋ 关联代码仓库</button></div></header>
  <div class="rq-body">
    <main class="rq-chat"><div class="rq-transcript" id="rq-messages" aria-live="polite"></div><section class="rq-compose"><div class="rq-muted">本轮输入</div><div class="rq-chips" id="rq-chips"></div><textarea id="rq-input" aria-label="给专家的消息" placeholder="结合前后端代码，分析本需求的影响范围并产出架构设计…"></textarea><div class="rq-actions"><button id="rq-manage">管理引用</button><span class="rq-grow"></span><button class="rq-primary" id="rq-send">发送并冻结本轮输入 ↑</button></div></section></main>
    <aside class="rq-inspector" aria-label="需求上下文"><nav class="rq-tabs" role="tablist" aria-label="上下文分类"><button id="rq-tab-repos" role="tab" aria-selected="true" aria-controls="rq-panel-repos" data-tab="repos">代码仓库</button><button id="rq-tab-assets" role="tab" aria-selected="false" aria-controls="rq-panel-assets" data-tab="assets">资产</button><button id="rq-tab-story" role="tab" aria-selected="false" aria-controls="rq-panel-story" data-tab="story">需求</button></nav>
      <section class="rq-panel" id="rq-panel-repos" role="tabpanel" aria-labelledby="rq-tab-repos"><div class="rq-actions"><strong>本阶段使用的仓库</strong><span class="rq-grow"></span><button id="rq-add">＋ 关联</button></div><div id="rq-repos"></div></section>
      <section class="rq-panel" id="rq-panel-assets" role="tabpanel" aria-labelledby="rq-tab-assets" hidden><strong>本阶段引用的资产版本</strong><div id="rq-assets"></div></section>
      <section class="rq-panel" id="rq-panel-story" role="tabpanel" aria-labelledby="rq-tab-story" hidden><h3>门店补货审批流程</h3><div class="rq-row"><p>门店提交补货申请，区域负责人审核后进入库存分配。支持退回修改与审批记录查询。</p></div><div class="rq-row"><strong>验收要点</strong><p>角色权限、审批状态一致性、重复提交处理、库存不足提示。</p></div></section>
    </aside>
  </div>
  <footer class="rq-footer" id="rq-foot">引用选择只影响下一轮；已发送消息保留当时的输入版本。</footer>
  <div class="rq-overlay" id="rq-modal" hidden><form class="rq-dialog" id="rq-form" role="dialog" aria-modal="true" aria-labelledby="rq-dialog-title"><h3 id="rq-dialog-title">关联代码仓库</h3><label>仓库名称<input id="rq-name" value="shared-contracts" required></label><label>用途<select id="rq-role"><option>公共库</option><option>前端</option><option>后端</option><option>其他</option></select></label><label>本地仓库路径<input id="rq-path" value="/work/shared-contracts" required></label><label>本阶段分析范围<input id="rq-scope" value="schemas/approval/" required></label><p class="rq-alert" id="rq-validation">示例关联表单</p><div class="rq-actions"><button type="button" id="rq-cancel">取消</button><button class="rq-primary" type="submit">校验并关联</button></div></form></div>
</div>
<script>
(()=>{
const root=document.getElementById('rq-multi');
const q=s=>root.querySelector(s);
const repos=[{id:'web',name:'store-web',role:'前端',path:'/work/store-web',ref:'feature/approval',commit:'a72e901',scope:'src/pages/approval/',dirty:false},{id:'api',name:'order-service',role:'后端',path:'/work/order-service',ref:'develop',commit:'b54c230',scope:'modules/approval/',dirty:true}];
const assets=[{id:'prd',name:'产品需求文档.md',version:'v3',hash:'7a61f20',stage:'产品 PRD'},{id:'baseline',name:'需求基线.md',version:'v2',hash:'b40a159',stage:'设计评审'},{id:'design',name:'技术设计.md',version:'v1',hash:'e108ba4',stage:'软件架构设计'}];
const states={architecture:{repos:new Set(['web','api']),assets:new Set(['prd','baseline']),messages:[]},development:{repos:new Set(['api']),assets:new Set(['baseline','design']),messages:[]}};
let stage='architecture',editId=null,sequence=0;
const design={contextLabels:true,inspectorWidth:330};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tab(name){root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===name)));['repos','assets','story'].forEach(t=>q('#rq-panel-'+t).hidden=t!==name);}
function render(){
 const state=states[stage];
 q('.rq-body').style.gridTemplateColumns=globalThis.innerWidth>730?`minmax(0,1fr) ${design.inspectorWidth}px`:'';
 q('#rq-expert').textContent='已绑定：'+(stage==='architecture'?'软件架构师':'软件开发专家');
 q('#rq-repos').innerHTML=repos.map(r=>`<article class="rq-row"><label><input type="checkbox" data-repo="${r.id}" ${state.repos.has(r.id)?'checked':''}><strong><span class="rq-role">${r.role}</span>${escape(r.name)}</strong></label><p class="rq-path">${escape(r.path)}</p><p>${escape(r.ref)} · ${r.commit}</p><p>分析范围：${escape(r.scope)}</p><p>${r.dirty?'工作区有修改 · 本轮包含修改快照':'工作区干净'}</p><button data-edit="${r.id}">编辑关联</button></article>`).join('');
 q('#rq-assets').innerHTML=assets.filter(a=>stage==='development'||a.id!=='design').map(a=>`<article class="rq-row"><label><input type="checkbox" data-asset="${a.id}" ${state.assets.has(a.id)?'checked':''}><strong>${escape(a.name)}</strong></label><p>${a.version} · 已确认 · 已落地本地</p><p>来源：${a.stage}</p><p>版本指纹：${a.hash}</p></article>`).join('');
 const chips=[`需求 #10428`,...repos.filter(r=>state.repos.has(r.id)).map(r=>(design.contextLabels?r.role+' · ':'')+r.name),...assets.filter(a=>state.assets.has(a.id)).map(a=>(design.contextLabels?'资产 · ':'')+a.name+' '+a.version)];
 q('#rq-chips').innerHTML=chips.map(c=>`<span class="rq-chip">${escape(c)}</span>`).join('');
 q('#rq-send').disabled=!state.repos.size;
 q('#rq-messages').innerHTML=state.messages.map(m=>`<article class="rq-message user"><strong>你</strong><p>${escape(m.text)}</p><details><summary>本轮上下文 · ${m.repoCount} 个仓库 · ${m.assetCount} 份资产</summary><pre>${escape(m.snapshot)}</pre></details></article><article class="rq-message"><strong>${stage==='architecture'?'软件架构师':'软件开发专家'}</strong><p>已记录本轮输入。这里展示上下文传递效果，未调用 Agent。</p></article>`).join('');
 q('#rq-input').placeholder=stage==='architecture'?'结合前后端代码，分析本需求的影响范围并产出架构设计…':'按已确认的技术设计，完成后端审批模块…';
}
root.addEventListener('change',e=>{const el=e.target,s=states[stage];if(el.dataset.repo){el.checked?s.repos.add(el.dataset.repo):s.repos.delete(el.dataset.repo);render();}if(el.dataset.asset){el.checked?s.assets.add(el.dataset.asset):s.assets.delete(el.dataset.asset);render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)tab(b.dataset.tab);if(b.dataset.edit)open(repos.find(r=>r.id===b.dataset.edit));});
function open(repo){editId=repo?.id||null;q('#rq-dialog-title').textContent=repo?'编辑仓库关联':'关联代码仓库';q('#rq-name').value=repo?.name||'shared-contracts';q('#rq-role').value=repo?.role||'公共库';q('#rq-path').value=repo?.path||'/work/shared-contracts';q('#rq-scope').value=repo?.scope||'schemas/approval/';q('#rq-validation').textContent='示例关联表单';q('#rq-modal').hidden=false;q('#rq-name').focus();}
q('#rq-add').onclick=()=>open();q('#rq-add-top').onclick=()=>open();q('#rq-cancel').onclick=()=>q('#rq-modal').hidden=true;
q('#rq-form').onsubmit=e=>{e.preventDefault();const path=q('#rq-path').value.trim();if(!path.startsWith('/')&&!/^[A-Za-z]:[\\/]/.test(path)){q('#rq-validation').textContent='请填写本地绝对路径';return;}const repo={id:editId||'repo'+(++sequence),name:q('#rq-name').value.trim(),role:q('#rq-role').value,path,scope:q('#rq-scope').value.trim(),ref:'main',commit:'c83a102',dirty:false};if(editId)Object.assign(repos.find(r=>r.id===editId),repo);else repos.push(repo);states[stage].repos.add(repo.id);q('#rq-modal').hidden=true;tab('repos');q('#rq-foot').textContent='示例仓库已关联；实际产品由后端验证本地路径和 Git 信息。';render();};
q('#rq-manage').onclick=()=>tab('assets');q('#rq-stage').onchange=e=>{stage=e.target.value;q('#rq-input').value='';render();};
q('#rq-send').onclick=()=>{const s=states[stage],rs=repos.filter(r=>s.repos.has(r.id)),as=assets.filter(a=>s.assets.has(a.id));const snapshot=['需求：#10428','阶段：'+(stage==='architecture'?'软件架构设计':'软件开发'),'',...rs.map(r=>`${r.role}：${r.name}\n本地路径：${r.path}\n分支 / commit：${r.ref} / ${r.commit}\n范围：${r.scope}\n工作树：${r.dirty?'包含未提交修改的只读快照':'干净'}`),'',...as.map(a=>`资产：${a.name} ${a.version}\n本地版本路径：/requirement-assets/versions/${a.hash}/${a.name}`)].join('\n');s.messages.push({text:q('#rq-input').value.trim()||(stage==='architecture'?'请基于引用的仓库和资产完成架构分析。':'请按技术设计实现审批模块。'),snapshot,repoCount:rs.length,assetCount:as.length});q('#rq-input').value='';render();};
render();
if(globalThis.Tweak){const t=new Tweak({container:root,onChange:render});t.addToggle(design,'contextLabels',{label:'输入标签显示分类'});t.addSlider(design,'inspectorWidth',{label:'上下文侧栏宽度',min:290,max:380,step:10,unit:'px'});}
})();
</script>
